<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // The extension trusts https://bitchord.in only (web/extension/site.config.ts),
      // so www goes there before anything loads, keeping its path and query.
      if (location.hostname === 'www.bitchord.in') location.replace('https://bitchord.in' + location.pathname + location.search + location.hash);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#060606" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0f0f0" />
    <title>SpotiHi</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Satoshi is the app's typeface (from Figma Spotify Redesign design). -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
